<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Sport Organize</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="card">
        <h1 class="text-dark text-center" style="font-size: 1.875rem;">Iniciar Sesión</h1>
        <p class="text-gray text-center mb-8">Accede a tu cuenta de Sport Organize</p>
        
        <button class="btn btn-outline" style="width: 100%; margin-bottom: 1.5rem; display: flex; gap: 0.5rem; justify-content: center;">
          G Continuar con Google
        </button>
        
        <div class="divider">O continúa con tu usuario</div>

        <form action="php/login.php" method="POST">
          <!-- Campo oculto para enviar la URL de destino al backend PHP -->
          <input type="hidden" name="redirect" id="redirect">

          <div class="form-group">
            <label class="form-label">Usuario</label>
            <input type="text" name="usuario" class="form-control" placeholder="Ingrese su usuario" required>
          </div>
          <div class="form-group">
            <label class="form-label">Contraseña</label>
            <input type="password" name="clave" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" name="btn_login" class="btn btn-primary" style="width: 100%;">Iniciar Sesión</button>
        </form>
        
        <div class="text-center mt-4" style="margin-top: 1.5rem;">
          <span class="text-gray">¿No tienes cuenta?</span> 
          <a href="register.html" style="color: var(--primary); font-weight: 600;">Regístrate aquí</a>
        </div>
      </div>
      <div class="text-center" style="margin-top: 1.5rem;">
        <a href="index.html" class="text-gray">← Volver al inicio</a>
      </div>
    </div>
  </div>

  <!-- Script para leer ?redirect= de la URL y asignarlo al input oculto -->
  <script>
    const destino = new URLSearchParams(window.location.search).get('redirect');
    if (destino) {
      document.getElementById('redirect').value = destino;
    }
  </script>
</body>
</html>
