<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Sport Organize</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="card">
        <h1 class="text-dark text-center" style="font-size: 1.875rem;">Crear Cuenta</h1>
        <p class="text-gray text-center mb-8">Únete a Sport Organize y comienza a organizar torneos</p>
        
        <div id="alertSuccess" class="alert alert-success"></div>
        <div id="alertError" class="alert alert-error"></div>

        <button class="btn btn-outline" style="width: 100%; margin-bottom: 1.5rem; display: flex; gap: 0.5rem; justify-content: center;">
          G Continuar con Google
        </button>
        
        <div class="divider">O regístrate con email</div>

        <form id="registerForm" action="php/registro.php" method="POST">
  <div class="form-group">
    <label class="form-label">Nombre Completo</label>
    <input type="text" name="nombre" class="form-control" placeholder="Tu nombre" required>
  </div>
  <div class="form-group">
    <label class="form-label">Usuario</label>
    <input type="text" name="usuario" class="form-control" placeholder="Elige un usuario" required>
  </div>
  <div class="form-group">
    <label class="form-label">Correo Electrónico</label>
    <input type="email" name="email" class="form-control" placeholder="tu@email.com" required>
  </div>
  <div class="form-group">
    <label class="form-label">Contraseña</label>
    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required minlength="6">
  </div>
  <div class="form-group">
    <label class="form-label">Confirmar Contraseña</label>
    <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required minlength="6">
  </div>
  <button type="submit" class="btn btn-primary" style="width: 100%;">Crear Cuenta</button>
</form>
        
        <div class="text-center mt-4" style="margin-top: 1.5rem;">
          <span class="text-gray">¿Ya tienes cuenta?</span> 
          <a href="login.html" style="color: var(--primary); font-weight: 600;">Inicia sesión aquí</a>
        </div>
      </div>
      <div class="text-center" style="margin-top: 1.5rem;">
        <a href="index.html" class="text-gray">← Volver al inicio</a>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
